<title>Dashboard riservata</title>
<style>
  body{margin:0; min-height:100vh; display:grid; place-items:center; background:#221f1f; color:#faf6ee;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased;}
  form{width:min(340px,calc(100vw - 48px)); display:none;}
  .kicker{font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:#b9a892; margin:0 0 10px;}
  h1{font-family:Georgia,"Times New Roman",serif; font-weight:600; font-size:26px; margin:0 0 22px;}
  label{display:block; font-size:13px; color:#b9a892; margin:0 0 7px;}
  input{width:100%; box-sizing:border-box; font-size:16px; padding:11px 12px; border-radius:2px;
    border:1px solid #5b5049; background:#2d2927; color:#faf6ee;}
  input:focus-visible{outline:2px solid #b98a62; outline-offset:1px;}
  button{width:100%; margin-top:12px; font-size:15px; font-weight:600; padding:11px; border:0; border-radius:2px;
    background:#b98a62; color:#221f1f; cursor:pointer;}
  #errore{min-height:20px; margin:12px 0 0; font-size:13px; color:#e8a08e;}
</style>
<form id="modulo">
  <p class="kicker">Panamedia · Documento riservato</p>

  <p id="errore" role="alert"></p>
</form>

const ITERAZIONI = 250000;
const FIRMA = "DASHBOARD-OK\n";
const RICORDA = "dashboard-password";

async function decifra(password){
  const grezzo = Uint8Array.from(atob(CIFRATO), c => c.charCodeAt(0));
  const sale = grezzo.slice(8, 16), dati = grezzo.slice(16);
  const materiale = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bit = new Uint8Array(await crypto.subtle.deriveBits(
    {name:"PBKDF2", salt:sale, iterations:ITERAZIONI, hash:"SHA-256"}, materiale, 384));
  const chiave = await crypto.subtle.importKey("raw", bit.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const chiaro = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC", iv:bit.slice(32, 48)}, chiave, dati));
  if(!chiaro.startsWith(FIRMA)) throw new Error("password errata");
  return chiaro.slice(FIRMA.length);
}

async function apri(password){
  const pagina = await decifra(password);
  try{ localStorage.setItem(RICORDA, password); }catch(e){}
  document.open(); document.write(pagina); document.close();
}

const modulo = document.getElementById("modulo");
modulo.addEventListener("submit", async ev => {
  ev.preventDefault();
  const errore = document.getElementById("errore");
  errore.textContent = "";
  try{ await apri(document.getElementById("password").value.trim()); }
  catch(e){ errore.textContent = "Password non corretta."; }
});

/* chi ha già inserito la password su questo dispositivo entra direttamente */
(async () => {
  let salvata = null;
  try{ salvata = localStorage.getItem(RICORDA); }catch(e){}
  if(salvata){ try{ await apri(salvata); return; }catch(e){ try{ localStorage.removeItem(RICORDA); }catch(_){} } }
  modulo.style.display = "block";
  document.getElementById("password").focus();
})();
</script>
